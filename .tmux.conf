# https://hackmd.io/@lunzaizai/rJmSXfk-c#常用快捷建--指令

## Setup
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

## General

    set -g mouse on
    set -g default-terminal "tmux-256color"
    set -as terminal-features ",*:RGB"
    set -g renumber-windows on
    set-option -g history-limit 102400
    set -sg escape-time 0
    # window for chaining -r bindings after one prefix (default 500ms)
    set -g repeat-time 1000
    set -g focus-events on
    set -g allow-passthrough on
    set -g set-clipboard on

    # display-message takes over the whole status line, so bindings put their
    # text in @msg instead: status-right shows it in place of the cells, and
    # ${UNMSG} clears it after 2s. Usage: set -gF @msg "..." \; run-shell -b "${UNMSG}"
    # ponytail: a second message within 2s gets cleared early by the first timer
    %hidden UNMSG="sleep 2; tmux set -gu @msg"

## Key Bindings

    # Letter case matters!

    # PREFIX + I => Install plugins

    # PREFIX + k => Clear history
    bind-key -N "Clear history" k clear-history \; set -gF @msg "History cleared" \; run-shell -b "${UNMSG}"

    # PREFIX + r => Reload tmux config
    bind-key -N "Reload tmux config" r source-file ~/.tmux.conf \; set -gF @msg "~/.tmux.conf reloaded" \; run-shell -b "${UNMSG}"

    # PREFIX + c => Create new window
    bind-key -N "Create new window in current path" c new-window -c '#{pane_current_path}' \; set -gF @msg "New window created at #{pane_current_path}" \; run-shell -b "${UNMSG}"

    # PREFIX + x => Kill current pane (no confirmation)
    bind-key -N "Kill current pane (no confirmation)" x kill-pane

    # PREFIX + - => Split window vertically
    # PREFIX + | => Split window horizontally
    bind-key -N "Split window vertically" - split-window -v -c '#{pane_current_path}'
    bind-key -N "Split window horizontally" | split-window -h -c '#{pane_current_path}'

    # PREFIX + left => move to prev window
    # PREFIX + right => move to next window
    bind-key -N "Previous window" -r left previous-window
    bind-key -N "Next window" -r right next-window

    # PREFIX + S-left => swap window with the previous one
    # PREFIX + S-right => swap window with the next one
    bind-key -N "Swap window left" -r S-left swap-window -d -t -1
    bind-key -N "Swap window right" -r S-right swap-window -d -t +1

    # PREFIX + j => Show pane list
    bind-key -N "Show pane list" j choose-tree -swZ

## Plugins

    set -g @plugin 'tmux-plugins/tpm'
    set -g @plugin 'tmux-plugins/tmux-resurrect'
    set -g @plugin 'tmux-plugins/tmux-yank'
    set -g @plugin 'tmux-plugins/tmux-cpu'
    set -g @plugin 'catppuccin/tmux#v2.3.0'

## Plugin Settings

    # tmux-resurrect
    set -g @resurrect-capture-pane-contents 'on'

## Catppuccin Theme (all options before TPM run)

    set -g @catppuccin_flavor 'macchiato'
    set -g @catppuccin_status_background "#19151d"

## Initialize TPM (before status modules that depend on catppuccin)

    run '~/.tmux/plugins/tpm/tpm'

## Windows as plain "[number|text]", foreground only

    set -g  window-status-format         "#[fg=#{E:@thm_overlay_2},bg=default][#I|#{?automatic-rename,#{b:pane_current_path},#W}]"
    set -g  window-status-current-format "#[fg=#{E:@thm_mauve},bg=default][#I|#{?automatic-rename,#{pane_current_command},#W}]"
    set -g  window-status-separator " "

## Status Line: every cell is plain "[icon|content]", foreground only

    set-option -g status-position top
    set -g  status-right-length 150
    set -g  status-left ""
    set -g  status-right ""

    # cells sit inside #{?@msg,...}: no comma inside #[...] (see BADGE below)
    %hidden CELL="#[fg=#{E:@thm_yellow}]#[bg=default]"
    set -ag status-right "#{?@msg,#[fg=#{E:@thm_blue}]#[bg=default][#{@msg}] ,"
    set -ag status-right "${CELL}[M|#[fg=#{ram_fg_color}]#{ram_percentage}${CELL}] "
    # catppuccin sets bare @ram_*_fg_color but not gpu; tmux-cpu's gpu default is "#[fg=green]", which nests inside our #[fg=...]
    set -g @gpu_low_fg_color "#{E:@thm_fg}"
    set -g @gpu_medium_fg_color "#{E:@thm_fg}"
    set -g @gpu_high_fg_color "#{E:@thm_crust}"
    # if-shell, not #(): a #() would re-run the probe on every redraw
    if-shell 'nvidia-smi -L >/dev/null 2>&1' \
        'set -ag status-right "${CELL}[G|#[fg=#{gpu_fg_color}]#{gpu_percentage}${CELL}] "'
    set -ag status-right "}"

    ## Prefix / copy-mode badge

    # no comma inside #[...]: it would split the #{?...} branches below
    %hidden BADGE="#[fg=#{E:@thm_blue}]#[bg=default]"
    set -ag status-right "#{?client_prefix,${BADGE}⌘,#{?pane_in_mode,${BADGE}⎘, }}"

## tmux-cpu rewrites its #{*_percentage} / #{*_fg_color} tokens into #() calls,
## but it runs during TPM load, before status-right exists. Run it again here.

    run-shell '~/.tmux/plugins/tmux-cpu/cpu.tmux'
