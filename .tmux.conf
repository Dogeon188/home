# https://hackmd.io/@lunzaizai/rJmSXfk-c#常用快捷建--指令

## Setup
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

## General

    set -g mouse on
    set -g default-terminal "tmux-256color"
    set-option -ga terminal-overrides ",*:Tc"
    set -as terminal-features ",*:RGB"
    set -g renumber-windows on
    set-option -g history-limit 102400
    set -sg escape-time 0
    set -g focus-events on
    set -g allow-passthrough on
    set -g set-clipboard on

## Key Bindings

    # Letter case matters!

    # PREFIX + I => Install plugins

    # Ctrl + k => Clear history
    bind -n C-k clear-history \; display-message "History cleared"

    # PREFIX + r => Reload tmux config
    bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

    # PREFIX + c => Create new window
    bind-key c new-window -c '#{pane_current_path}' \; display-message "New window created at #{pane_current_path}"

    # PREFIX + x => Kill current pane (no confirmation)
    bind-key x kill-pane

    # PREFIX + - => Split window vertically
    # PREFIX + | => Split window horizontally
    bind-key - split-window -v -c '#{pane_current_path}'
    bind-key | split-window -h -c '#{pane_current_path}'

    # PREFIX + left => move to prev window
    # PREFIX + right => move to next window
    bind-key -r left previous-window
    bind-key -r right next-window

    # PREFIX + j => Show pane list
    bind-key j choose-tree -swZ

## Plugins

    set -g @plugin 'tmux-plugins/tpm'
    set -g @plugin 'tmux-plugins/tmux-resurrect'
    set -g @plugin 'tmux-plugins/tmux-continuum'
    set -g @plugin 'tmux-plugins/tmux-yank'
    set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
    set -g @plugin 'tmux-plugins/tmux-cpu'
    set -g @plugin 'catppuccin/tmux#v2.3.0'

## Plugin Settings

    # tmux-resurrect
    set -g @resurrect-capture-pane-contents 'on'

    # tmux-continuum
    set -g @continuum-restore 'on'

## Catppuccin Theme (all options before TPM run)

    set -g @catppuccin_flavor 'macchiato'
    set -g @catppuccin_window_status_style "rounded"
    set -g @catppuccin_window_current_text " #{pane_current_command}"
    set -g @catppuccin_window_text " #{b:pane_current_path}"
    set -g @catppuccin_date_time_color "#759bd7"
    set -g @catppuccin_status_background "#19151d"

## Initialize TPM (before status modules that depend on catppuccin)

    run '~/.tmux/plugins/tpm/tpm'

## Rounded window separators without reverse-video
## (some terminals mishandle combined truecolor+reverse SGR, see #{@_ctp_status_bg})

    set -g @catppuccin_window_left_separator "#[fg=#{@thm_overlay_2},bg=#{@_ctp_status_bg}]#[fg=#{@_ctp_status_bg},bg=#{@thm_overlay_2}]"
    set -g @catppuccin_window_right_separator "#[fg=#{@thm_surface_0},bg=#{@_ctp_status_bg}]#[none]"
    set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_mauve},bg=#{@_ctp_status_bg}]#[fg=#{@_ctp_status_bg},bg=#{@thm_mauve}]"
    set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_surface_1},bg=#{@_ctp_status_bg}]#[none]"

## tmux-cpu reads its color options via raw show-option (no #{} expansion),
## so catppuccin's own "#{E:@thm_*}" references never resolve for it. Fix
## RAM's (already set by catppuccin's ram.conf) and GPU's (ours) colors to
## literal, eagerly-expanded hex.

    set -gF @ram_low_fg_color "#{E:@thm_fg}"
    set -gF @ram_medium_fg_color "#{E:@thm_fg}"
    set -gF @ram_high_fg_color "#{E:@thm_crust}"
    set -gF @ram_low_bg_color "#{E:@catppuccin_status_module_text_bg}"
    set -gF @ram_medium_bg_color "#{E:@catppuccin_status_module_text_bg}"
    set -gF @ram_high_bg_color "#{E:@thm_red}"

## GPU status module (catppuccin ships cpu/ram but no gpu; reuse tmux-cpu's
## gpu_*.sh scripts through the same status_module.conf template)

    %hidden MODULE_NAME="gpu"
    set -gF @gpu_low_fg_color "#{E:@thm_fg}"
    set -gF @gpu_medium_fg_color "#{E:@thm_fg}"
    set -gF @gpu_high_fg_color "#{E:@thm_crust}"
    set -gF @gpu_low_bg_color "#{E:@catppuccin_status_module_text_bg}"
    set -gF @gpu_medium_bg_color "#{E:@catppuccin_status_module_text_bg}"
    set -gF @gpu_high_bg_color "#{E:@thm_red}"
    set -ogq "@catppuccin_${MODULE_NAME}_icon" "󰢮 "
    set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_yellow}"
    set -ogq "@catppuccin_status_${MODULE_NAME}_text_fg" "#{l:#{gpu_fg_color}}"
    set -ogq "@catppuccin_status_${MODULE_NAME}_text_bg" "#{l:#{gpu_bg_color}}"
    set -ogq "@catppuccin_${MODULE_NAME}_text" " #{l:#{gpu_percentage}}"

    source -F "~/.tmux/plugins/tmux/utils/status_module.conf"

## Status Line (after TPM so #{E:@catppuccin_status_*} resolves correctly)

    set-option -g status-position top
    set -g  status-left-length 100
    set -g  status-right-length 150
    set -g  status-left ""
    set -g  status-right  "#{prefix_highlight}"
    set -agF status-right "#{E:@catppuccin_status_ram}"
    set -agF status-right "#{?#(nvidia-smi -L >/dev/null 2>&1 && echo 1),#{E:@catppuccin_status_gpu},}"

## Re-interpolate cpu/gpu/ram tokens now that status-right is finalized
## (tmux-cpu runs during TPM load, before this file finishes assembling
## status-right, so its first pass finds nothing to replace)

    run-shell '~/.tmux/plugins/tmux-cpu/cpu.tmux'
